<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>TRAVEL SAATHI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<script>
if (!localStorage.getItem("userEmail")) {
    alert("Please login first");
    window.location.href = "/login.html";
}
</script>

<h1>TRAVEL SAATHI</h1>

<div class="box">

    <!-- Source -->
    <input list="sourceList" id="source" placeholder="Source (From)" required 
    oninput="getSuggestions(this.value, 'sourceList')">
    <datalist id="sourceList"></datalist>

    <!-- Destination -->
    <input list="destList" id="destination" placeholder="Destination (To)" required 
    oninput="getSuggestions(this.value, 'destList')">
    <datalist id="destList"></datalist>

    <input type="date" id="date">

    <select id="vehicleType">
        <option value="">Select Vehicle</option>
        <option value="Bike">Bike</option>
        <option value="Car">Car</option>
        <option value="Cab">Cab</option>
        <option value="Bus">Bus</option>
    </select>

    <button type="button" onclick="calculateFare()">
        Calculate Fare
    </button>

    <h3 id="fare" style="color:black;"></h3>

    <button type="button" onclick="bookNow()">BOOK NOW</button>

</div>

<script src="app.js"></script>

<!-- ✅ FIX: ADD LOGOUT FUNCTION -->
<script>
function logoutUser() {
    localStorage.removeItem("userEmail");
    window.location.href = "/login.html";
}
</script>

<button class="logout-btn" onclick="logoutUser()">
    Logout
</button>
<!-- CHAT BUTTON -->
<div id="chatButton">💬</div>

<!-- CHAT BOX -->
<div id="chatBox">

    <div id="chatHeader">
        Travel Saathi Chatbot
    </div>

    <div id="chatMessages"></div>

    <div id="chatInputArea">

    <input
        type="text"
        id="userInput"
        placeholder="Type message..."
        autocomplete="off"
    >

    <button type="button" onclick="sendMessage()">
        Send
    </button>

</div>
</div>

<script>

const chatButton =
document.getElementById("chatButton");

const chatBox =
document.getElementById("chatBox");

chatButton.onclick = function () {

    if(chatBox.style.display === "flex"){
        chatBox.style.display = "none";
    }
    else{
        chatBox.style.display = "flex";
    }

};

async function sendMessage(){

    const input =
    document.getElementById("userInput");

    const message =
    input.value.trim();

    if(!message) return;

    const chatMessages =
    document.getElementById("chatMessages");

    chatMessages.innerHTML +=
    `<div class="user">${message}</div>`;

    input.value = "";

    try{

        const res = await fetch("/chat",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({message})
        });

        const data = await res.json();

        chatMessages.innerHTML +=
        `<div class="bot">${data.reply}</div>`;

    }
    catch(err){

        chatMessages.innerHTML +=
        `<div class="bot">Server Error</div>`;

    }

}

</script>
</body>
</html>
